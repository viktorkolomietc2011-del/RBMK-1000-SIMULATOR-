name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set permissions and clean cache
      run: |
        chmod -R 777 .
        rm -rf .buildozer bin

    - name: Build with Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:latest buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: rbmk-simulator-apk
        path: bin/*.apk
        
