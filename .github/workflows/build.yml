name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        # Если buildozer.spec отсутствует, создаем его автоматически
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # Запускаем сборку
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: python-game-apk
        path: bin/*.apk
        
