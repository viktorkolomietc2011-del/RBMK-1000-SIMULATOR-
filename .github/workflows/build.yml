name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y ccache git libffi-dev build-essential python3-dev libssl-dev libsqlite3-dev zlib1g-dev openjdk-17-jdk zip unzip
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Build with Buildozer
      env:
        ACCEPT_SDK_LICENSE: "yes"
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/g' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        fi
        # Раскомментируем принятие лицензий в конфиге, если он уже был
        sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # Запуск сборки с передачей «y» в любой стем
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: python-game-apk
        path: bin/*.apk
        
