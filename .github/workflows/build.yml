name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Force Accept SDK License in Spec
      run: sed -i 's/.*android.accept_sdk_license.*/android.accept_sdk_license = True/g' buildozer.spec

    - name: Fix permissions for Docker
      run: chmod -R 777 $GITHUB_WORKSPACE

    - name: Build with Official Buildozer Docker
      run: docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:latest buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rbmk-simulator-apk
        path: bin/*.apk
        
